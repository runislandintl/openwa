services:
  - type: web
    name: openwa-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 2785
      - key: DATABASE_TYPE
        value: sqlite
      - key: DATABASE_NAME
        value: /app/data/openwa.sqlite
      - key: DATABASE_SYNCHRONIZE
        value: true
      - key: ENGINE_TYPE
        value: whatsapp-web.js
      - key: PUPPETEER_HEADLESS
        value: true
      - key: PUPPETEER_ARGS
        value: --no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      - key: STORAGE_TYPE
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /app/data/media
      - key: WEBHOOK_TIMEOUT
        value: 10000
      - key: WEBHOOK_MAX_RETRIES
        value: 3

  - type: web
    name: openwa-dashboard
    runtime: static
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./dist
    rootDir: dashboard
    envVars:
      - key: VITE_API_URL
        fromService:
          name: openwa-api
          type: web
          property: host
